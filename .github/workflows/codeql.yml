name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality
      - name: Install Qt + deps (for build)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev zlib1g-dev build-essential pkg-config
      - name: Build (for CodeQL)
        run: |
          if [ -f MangaDexExporter.pro ]; then
            mkdir -p build && cd build
            qmake6 ../MangaDexExporter.pro || qmake ../MangaDexExporter.pro
            make -j$(nproc) || true
          else
            echo "No source to build — skipping"
          fi
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
