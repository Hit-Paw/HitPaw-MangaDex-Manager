name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded secrets..."
          # Allowlist: QSettings user-supplied values, comments, and the public TOKEN_URL
          if grep -R --include="*.cpp" --include="*.h" --include="*.pro" -n -E "gho_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9_]{20,}" .; then
            echo "::error::Potential GitHub token found in source!"
            exit 1
          fi
          # Check for hardcoded client_secret assignment with non-empty literal (excluding QSettings default "")
          if grep -R --include="*.cpp" -n -E "client_secret.*=.*\"[^\"]{8,}\"" . | grep -v "QSettings" | grep -v "user-supplied" | grep -v "m_settings.value"; then
            echo "::error::Potential hardcoded client_secret found!"
            exit 1
          fi
          echo "No hardcoded credentials found - all auth is user-supplied via QSettings/UI at runtime."

  check-version:
    runs-on: ubuntu-latest
    needs: scan-secrets
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches CMakeLists and CHANGELOG
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Tag: $TAG"
          CMAKE_VER=$(grep -oP 'project\(MangaDexExporter VERSION \K[0-9.]+' CMakeLists.txt)
          echo "CMakeLists.txt version: $CMAKE_VER"
          if [ "$TAG" != "$CMAKE_VER" ]; then
            echo "::error::Tag v$TAG != CMakeLists.txt $CMAKE_VER — bump CMakeLists.txt project(VERSION) to match tag"
            exit 1
          fi
          if ! grep -q "## \[$TAG\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no ## [$TAG] section — notes will be 'Release v$TAG'"
          else
            echo "CHANGELOG has $TAG"
          fi
          echo "Version check OK"

  build-windows:
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
          setup-python: false

      - name: Build (qmake + mingw32-make)
        shell: cmd
        run: |
          if not exist MangaDexExporter.pro (
            echo ::error::MangaDexExporter.pro is missing; refusing to create an unverified release.
            exit /b 1
          )
          if exist build_win rmdir /s /q build_win
          mkdir build_win
          cd build_win
          qmake ..\MangaDexExporter.pro -spec win32-g++
          mingw32-make -j4
          if errorlevel 1 exit /b 1
          cd ..

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          for /r build_win %%F in (MangaDexExporter.exe) do set EXE=%%F
          windeployqt "%EXE%"

      - name: Package ZIP (clean, no .o files)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $src = "build_win/release"
          $stage = "stage-win"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $files = @("MangaDexExporter.exe","D3Dcompiler_47.dll","libgcc_s_seh-1.dll","libstdc++-6.dll","libwinpthread-1.dll","opengl32sw.dll","Qt6Core.dll","Qt6Gui.dll","Qt6Network.dll","Qt6Svg.dll","Qt6Widgets.dll")
          foreach ($f in $files) { Copy-Item "$src/$f" $stage -Force }
          $dirs = @("generic","iconengines","imageformats","networkinformation","platforms","styles","tls","translations")
          foreach ($d in $dirs) { Copy-Item "$src/$d" "$stage/$d" -Recurse -Force }
          $zip = "HitPawMangaDexManager-v$version-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Host "Created $zip ($( (Get-Item $zip).Length / 1MB ) MB, $((Get-ChildItem $stage -Recurse | Measure-Object).Count) files)"
          if (Test-Path $zip) { Write-Host "ZIP OK" } else { exit 1 }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: HitPawMangaDexManager-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: HitPawMangaDexManager-*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev zlib1g-dev build-essential pkg-config

      - name: Build
        run: |
          if [ ! -f MangaDexExporter.pro ]; then echo "::error::MangaDexExporter.pro is missing; refusing to create an unverified release."; exit 1; fi
          rm -rf build_linux
          mkdir build_linux
          cd build_linux
          qmake6 ../MangaDexExporter.pro
          make -j$(nproc)
          cd ..

      - name: Package tar.gz
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SRC=$(find build_linux -name "MangaDexExporter" -type f | head -1)
          if [ -z "$SRC" ]; then echo "EXE not found"; exit 1; fi
          STAGE="stage-linux"
          mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/"
          # Bundle Qt libs (best-effort)
          ldd "$SRC" | grep -oP "/[^\s]+" | while read LIB; do if echo "$LIB" | grep -q "libQt"; then cp "$LIB" "$STAGE/" 2>/dev/null || true; fi; done
          TAR="HitPawMangaDexManager-v${VERSION}-Linux.tar.gz"
          tar -czf "$TAR" -C "$STAGE" .
          ls -lh "$TAR"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: HitPawMangaDexManager-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: HitPawMangaDexManager-*.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          brew update
          brew install qt@6
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          if [ ! -f MangaDexExporter.pro ]; then echo "::error::MangaDexExporter.pro is missing; refusing to create an unverified release."; exit 1; fi
          rm -rf build_macos
          mkdir build_macos
          cd build_macos
          qmake ../MangaDexExporter.pro
          make -j$(sysctl -n hw.ncpu)
          cd ..

      - name: Package tar.gz
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APP="build_macos/MangaDexExporter.app"
          if [ ! -d "$APP" ]; then APP=$(find build_macos -name "MangaDexExporter" -type f | head -1); fi
          if [ -z "$APP" ]; then echo "App not found"; exit 1; fi
          STAGE="stage-macos"
          mkdir -p "$STAGE"
          if [ -d "$APP" ]; then cp -R "$APP" "$STAGE/"; else cp "$APP" "$STAGE/"; fi
          TAR="HitPawMangaDexManager-v${VERSION}-macOS.tar.gz"
          tar -czf "$TAR" -C "$STAGE" .
          ls -lh "$TAR"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: HitPawMangaDexManager-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-tar
          path: HitPawMangaDexManager-*.tar.gz
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -R dist || true; ls -lh dist || true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Changelog for $VERSION:"
          echo "$NOTES"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: HitPaw MangaDex Manager v${{ steps.version.outputs.VERSION }}
          body: |
            ## What it does

            Browse and search your MangaDex library with cover art
            Download chapters for offline reading
            Export your list to CSV, JSON, MAL XML, MangaBaka JSON, and Anime-Planet .xml.gz
            Import-compatible with MyAnimeList, AniList, MangaBaka, Kitsu, MangaFire, Anime-Planet

            ## What changed in v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ## How to use

            1. Download and extract the ZIP
            2. Run MangaDexExporter.exe
            3. Log in with your MangaDex account (username/password or access token)

            ## Requirements

            - Windows 10/11 (64-bit)
            - No Qt installation needed -- all DLLs are bundled

            ## Build from source

            See README.md for build instructions on Windows, Linux, and macOS.
          draft: false
          files: dist/*
