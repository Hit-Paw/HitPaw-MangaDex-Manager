name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -R --include="*.cpp" --include="*.h" --include="*.pro" -n -E "gho_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9_]{20,}" .; then
            echo "::error::Potential GitHub token found!"
            exit 1
          fi
          # client_secret literal check (allowlist QSettings)
          if grep -R --include="*.cpp" -n -E "client_secret.*=.*\"[^\"]{8,}\"" . | grep -v "QSettings" | grep -v "m_settings.value" | grep -q .; then
            echo "::error::Hardcoded client_secret!"
            exit 1
          fi
          echo "No hardcoded tokens."

  lint:
    runs-on: ubuntu-latest
    needs: scan-secrets
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format + shellcheck
        run: sudo apt-get update && sudo apt-get install -y clang-format shellcheck
      - name: clang-format check
        run: |
          echo "Checking C++ formatting (clang-format --dry-run)..."
          if ! clang-format --dry-run --Werror main.cpp domain.h export.h pal.h secure_store.h 2>&1; then
            echo "::warning::clang-format would reformat files — run clang-format -i"
            # non-blocking for now — change to exit 1 to enforce
          fi
          echo "clang-format check done"
      - name: shellcheck
        run: |
          shellcheck build_linux.sh build_macos.sh || true
          shellcheck -s batch build_windows.bat || true
      - name: whitespace check
        run: |
          git diff --check || (echo "::error::Whitespace errors"; exit 1)
          echo "No whitespace errors"

  build-check-windows:
    runs-on: windows-latest
    needs: [scan-secrets, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_version: '6.8.3'
            qt_arch: 'win64_mingw'
            qt_tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          # Uncomment to test Qt 6.9 on PRs (adds ~3 min):
          # - qt_version: '6.9.1'
          #   qt_arch: 'win64_mingw'
          #   qt_tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          cache: true
          setup-python: false
      - name: Build check
        shell: cmd
        run: |
          if not exist MangaDexExporter.pro (
            echo ::error::MangaDexExporter.pro is missing; source must be committed for CI to validate a release.
            exit /b 1
          )
          if exist build_win rmdir /s /q build_win
          mkdir build_win
          cd build_win
          qmake ..\MangaDexExporter.pro -spec win32-g++
          mingw32-make -j4
          if errorlevel 1 exit /b 1
          echo Build OK
          dir release\MangaDexExporter.exe

  build-check-linux:
    runs-on: ubuntu-latest
    needs: [scan-secrets, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt6 + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev zlib1g-dev build-essential pkg-config
      - name: Build check (qmake)
        run: |
          if [ ! -f MangaDexExporter.pro ]; then echo "::error::MangaDexExporter.pro missing"; exit 1; fi
          rm -rf build_linux && mkdir build_linux && cd build_linux
          qmake6 ../MangaDexExporter.pro || qmake ../MangaDexExporter.pro
          make -j$(nproc)
          echo "Linux build OK"

  build-check-macos:
    runs-on: macos-latest
    needs: [scan-secrets, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt6
        run: |
          brew update
          brew install qt@6
          # Ensure qmake is linked and available
          brew link qt@6 --force || true
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "Qt prefix: $(brew --prefix qt@6)"
          ls -l $(brew --prefix qt@6)/bin/qmake* || true
      - name: Build check (qmake)
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          if [ ! -f MangaDexExporter.pro ]; then echo "::error::MangaDexExporter.pro missing"; exit 1; fi
          rm -rf build_macos && mkdir build_macos && cd build_macos
          qmake6 ../MangaDexExporter.pro 2>/dev/null || qmake ../MangaDexExporter.pro 2>/dev/null || /opt/homebrew/opt/qt@6/bin/qmake ../MangaDexExporter.pro || $(brew --prefix qt@6)/bin/qmake ../MangaDexExporter.pro
          make -j$(sysctl -n hw.ncpu)
          echo "macOS build OK"

  tests:
    runs-on: ubuntu-latest
    needs: [scan-secrets, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt6 + deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev zlib1g-dev
      - name: Build + run Qt Test (if present)
        run: |
          if [ -d tests ]; then
            cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Release
            cmake --build build_tests -j$(nproc)
            ctest --test-dir build_tests --output-on-failure
          else
            echo "No tests/ yet — skipping"
          fi
