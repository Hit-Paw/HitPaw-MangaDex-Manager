name: Bug Report
description: Report a bug or something that isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the info below so I can fix it.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running?
      placeholder: e.g. 3.1.1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug.
      placeholder: e.g. App crashes when I click Export
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps to trigger this bug.
      placeholder: |
        1. Open the app
        2. Sign in
        3. Click Export
        4. Crash
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      description: Paste any relevant logs from the app's log panel or console.
      render: text
    validations:
      required: false
